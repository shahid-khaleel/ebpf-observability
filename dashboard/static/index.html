<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>eBPF Kernel Observability Lab</title>
<style>
  :root {
    --bg: #0b0f14; --panel: #121821; --border: #22303f; --text: #d8e1ea;
    --dim: #7c8a99; --accent: #4fd1c5; --red: #ff5d5d; --yellow: #ffcc66; --green: #63e6be;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", ui-sans-serif, system-ui, sans-serif;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .sub { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .stack { display: flex; align-items: baseline; gap: 10px; }
  .badge {
    font-size: 11px; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--border);
    color: var(--dim);
  }
  main {
    display: grid; gap: 14px; padding: 14px;
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: auto auto auto;
  }
  .panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    display: flex; flex-direction: column; min-height: 260px; max-height: 340px;
  }
  .panel.alerts { grid-column: 1 / -1; border-color: #4a1f1f; }
  .panel h2 {
    font-size: 13px; margin: 0; padding: 10px 12px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; color: var(--accent); font-weight: 600;
    letter-spacing: .02em; text-transform: uppercase;
  }
  .panel.alerts h2 { color: var(--red); }
  .panel h2 .count { color: var(--dim); font-weight: 400; text-transform: none; }
  .rows { overflow-y: auto; font-size: 12px; font-family: ui-monospace, Consolas, monospace; }
  .row { padding: 6px 12px; border-bottom: 1px solid #182028; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row:hover { background: #16202b; }
  .row .t { color: var(--dim); margin-right: 8px; }
  .row .k { color: var(--accent); }
  .row.mal { background: rgba(255,93,93,0.12); color: var(--red); }
  .empty { color: var(--dim); padding: 16px; font-size: 12px; }
  .flag { padding: 1px 6px; border-radius: 4px; font-size: 10px; margin-left: 6px; }
  .flag.egress { background: #22303f; color: var(--yellow); }
  .flag.ingress { background: #22303f; color: var(--green); }
  .flag.bad { background: var(--red); color: #1a0000; font-weight: 700; }
</style>
</head>
<body>
<header>
  <div class="stack">
    <h1>eBPF Kernel Observability Lab</h1>
    <span class="badge">Cilium + Hubble (network)</span>
    <span class="badge">Tetragon (process / file / syscall)</span>
  </div>
  <div class="sub" id="last-update">connecting…</div>
</header>
<main>
  <div class="panel alerts">
    <h2>Threat Intel Alerts <span class="count" id="c-alerts">0</span></h2>
    <div class="rows" id="alerts"></div>
  </div>

  <div class="panel">
    <h2>Network Connections <span class="count" id="c-connections">0</span></h2>
    <div class="rows" id="connections"></div>
  </div>

  <div class="panel">
    <h2>Process Creation <span class="count" id="c-processes">0</span></h2>
    <div class="rows" id="processes"></div>
  </div>

  <div class="panel">
    <h2>File Access <span class="count" id="c-files">0</span></h2>
    <div class="rows" id="files"></div>
  </div>

  <div class="panel">
    <h2>System Calls <span class="count" id="c-syscalls">0</span></h2>
    <div class="rows" id="syscalls"></div>
  </div>
</main>

<script>
function ts(t) {
  if (!t) return "";
  const d = new Date(t);
  if (isNaN(d)) return t;
  return d.toLocaleTimeString();
}
function esc(s) {
  return (s ?? "").toString().replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}
function renderEmpty(el) {
  el.innerHTML = '<div class="empty">waiting for events…</div>';
}

async function refresh() {
  try {
    const [alerts, conns, procs, files, sys] = await Promise.all(
      ["alerts", "connections", "processes", "files", "syscalls"].map(
        p => fetch("/api/" + p).then(r => r.json())
      )
    );

    document.getElementById("c-alerts").textContent = alerts.length;
    document.getElementById("c-connections").textContent = conns.length;
    document.getElementById("c-processes").textContent = procs.length;
    document.getElementById("c-files").textContent = files.length;
    document.getElementById("c-syscalls").textContent = sys.length;

    const alertsEl = document.getElementById("alerts");
    alertsEl.innerHTML = alerts.length ? alerts.map(a => `
      <div class="row mal">
        <span class="t">${ts(a.time)}</span>
        <span class="k">${esc(a.src_pod || a.src_ip)}</span> &rarr;
        <b>${esc(a.dst_ip)}</b>:${esc(a.dst_port)} (${esc(a.protocol)})
        <span class="flag bad">MALICIOUS IP</span>
      </div>`).join("") : "";
    if (!alerts.length) renderEmpty(alertsEl);

    const connEl = document.getElementById("connections");
    connEl.innerHTML = conns.map(c => `
      <div class="row ${c.malicious ? "mal" : ""}">
        <span class="t">${ts(c.time)}</span>
        <span class="k">${esc(c.src_pod || c.src_ip || "?")}</span> &rarr;
        ${esc(c.dst_pod || c.dst_ip || "?")}:${esc(c.dst_port ?? "")}
        <span class="flag ${c.direction === "EGRESS" ? "egress" : "ingress"}">${esc(c.direction || "")}</span>
        ${c.malicious ? '<span class="flag bad">THREAT</span>' : ""}
      </div>`).join("");
    if (!conns.length) renderEmpty(connEl);

    const procEl = document.getElementById("processes");
    procEl.innerHTML = procs.map(p => `
      <div class="row">
        <span class="t">${ts(p.time)}</span>
        <span class="k">[${esc(p.namespace)}/${esc(p.pod)}]</span>
        ${p.event === "exit" ? "exit" : "exec"} <b>${esc(p.binary)}</b> ${esc(p.arguments || "")}
      </div>`).join("");
    if (!procs.length) renderEmpty(procEl);

    const fileEl = document.getElementById("files");
    fileEl.innerHTML = files.map(f => `
      <div class="row">
        <span class="t">${ts(f.time)}</span>
        <span class="k">[${esc(f.namespace)}/${esc(f.pod)}]</span>
        <b>${esc(f.binary)}</b> opened ${esc(f.path)}
      </div>`).join("");
    if (!files.length) renderEmpty(fileEl);

    const sysEl = document.getElementById("syscalls");
    sysEl.innerHTML = sys.map(s => `
      <div class="row">
        <span class="t">${ts(s.time)}</span>
        <span class="k">[${esc(s.namespace)}/${esc(s.pod)}]</span>
        <b>${esc(s.binary)}</b> called ${esc(s.syscall)}
      </div>`).join("");
    if (!sys.length) renderEmpty(sysEl);

    document.getElementById("last-update").textContent = "updated " + new Date().toLocaleTimeString();
  } catch (e) {
    document.getElementById("last-update").textContent = "connection error";
  }
}
refresh();
setInterval(refresh, 1500);
</script>
</body>
</html>
