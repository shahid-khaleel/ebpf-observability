apiVersion: v1
kind: ServiceAccount
metadata:
  name: web-backend
  namespace: ebpf-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-backend
  namespace: ebpf-lab
  labels:
    app: web-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-backend
  template:
    metadata:
      labels:
        app: web-backend
    spec:
      # Dedicated, least-privilege ServiceAccount - no Role/RoleBinding is
      # granted to it, since this workload never talks to the Kubernetes
      # API. Required by the disallow-default-serviceaccount Kyverno policy;
      # see k8s/kyverno/policies/.
      serviceAccountName: web-backend
      automountServiceAccountToken: false
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: web-backend
  namespace: ebpf-lab
spec:
  selector:
    app: web-backend
  ports:
    - port: 80
      targetPort: 80
