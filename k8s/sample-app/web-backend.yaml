apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-backend
  namespace: ebpf-lab
  labels:
    app: web-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-backend
  template:
    metadata:
      labels:
        app: web-backend
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: web-backend
  namespace: ebpf-lab
spec:
  selector:
    app: web-backend
  ports:
    - port: 80
      targetPort: 80
