# Expected result: REJECTED by the disallow-default-serviceaccount policy.
# `kubectl apply -f fail-pod-default-sa.yaml` should fail with an admission
# webhook error - no serviceAccountName means the implicit "default" SA.
apiVersion: v1
kind: Pod
metadata:
  name: kyverno-test-fail-default-sa
  namespace: default
spec:
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["sleep", "60"]
