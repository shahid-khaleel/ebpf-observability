# Expected result: ALLOWED. Uses a dedicated ServiceAccount, so it satisfies
# the disallow-default-serviceaccount policy.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kyverno-test-pass-sa
  namespace: default
---
apiVersion: v1
kind: Pod
metadata:
  name: kyverno-test-pass-custom-sa
  namespace: default
spec:
  serviceAccountName: kyverno-test-pass-sa
  automountServiceAccountToken: false
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["sleep", "60"]
