apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-default-serviceaccount
  annotations:
    policies.kyverno.io/title: Disallow Default ServiceAccount
    policies.kyverno.io/category: RBAC Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Kubernetes implicitly attaches the "default" ServiceAccount (and its
      token) to any Pod that doesn't request one explicitly, which makes it
      hard to reason about what RBAC identity a workload actually runs
      as. This policy requires every Pod to name a dedicated,
      least-privilege ServiceAccount.
spec:
  validationFailureAction: Enforce
  # exclude.any[].subjects depends on live admission-request context (who's
  # making the request), which isn't available during Kyverno's periodic
  # background re-scan of already-existing resources - Kyverno itself
  # rejects background=true combined with a subjects-based exclude. This
  # lab cares about admission-time enforcement (the kubectl apply path),
  # not retroactive scanning, so background mode is disabled.
  background: false
  rules:
    - name: validate-service-account
      match:
        any:
          - resources:
              kinds:
                - Pod
              operations:
                - CREATE
                - UPDATE
      exclude:
        any:
          # Kyverno's own control-plane pods/jobs are managed by its Helm
          # chart, which the policy engine shouldn't be enforcing against
          # itself. See the matching note in restrict-rbac-wildcards.yaml.
          - subjects:
              - kind: ServiceAccount
                namespace: kyverno
                name: "*"
      validate:
        message: >-
          Pods may not use the "default" ServiceAccount (or omit
          spec.serviceAccountName, which implies "default"). Create a
          dedicated ServiceAccount for this workload instead.
        deny:
          conditions:
            any:
              - key: "{{ request.object.spec.serviceAccountName || 'default' }}"
                operator: Equals
                value: "default"
